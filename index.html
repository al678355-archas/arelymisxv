<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf8f6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <title>Mis XV Años</title>

    <!-- Pantalla de carga: visible desde el primer instante (antes de que cargue JavaScript).
         React muestra el mismo marcado (src/components/Loader.jsx) y lo desvanece al terminar. -->
    <style>
      .xv-loader {
        --l-primary: #b76e79;
        --l-accent: #c9a063;
        --l-bg: #fdf8f6;
        --l-bg2: #f3d9dc;
        --l-text: #8a7479;
        --l-script: 'Great Vibes', 'Brush Script MT', cursive;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        color: var(--l-text);
        background: radial-gradient(circle at 50% 42%, var(--l-bg) 0%, var(--l-bg) 38%, var(--l-bg2) 120%);
        font-family: Georgia, 'Times New Roman', serif;
        overflow: hidden;
        transition: opacity 0.7s ease, visibility 0.7s ease;
      }
      .xv-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .xv-loader.is-done .xv-loader__flower {
        transform: scale(1.25);
        transition: transform 0.7s ease;
      }
      .xv-loader__flower {
        position: relative;
        width: 150px;
        height: 150px;
        display: grid;
        place-items: center;
        margin: 26px 0 28px;
      }
      .xv-loader__petals {
        position: absolute;
        inset: 0;
        animation: xvl-spin 14s linear infinite;
      }
      .xv-loader__petal {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 64px;
        margin: -64px 0 0 -15px;
        border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
        background: linear-gradient(180deg, var(--l-primary), color-mix(in srgb, var(--l-primary) 35%, var(--l-bg2)));
        transform-origin: 50% 100%;
        transform: rotate(calc(var(--i) * 45deg)) scale(0.55);
        opacity: 0.4;
        animation: xvl-bloom 2.8s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.14s);
        box-shadow: inset 0 -6px 10px -6px rgba(255, 255, 255, 0.6);
      }
      .xv-loader__petal:nth-child(even) {
        background: linear-gradient(180deg, var(--l-accent), color-mix(in srgb, var(--l-accent) 30%, var(--l-bg2)));
      }
      .xv-loader__ring {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px dashed color-mix(in srgb, var(--l-accent) 70%, transparent);
        animation: xvl-spin 20s linear infinite reverse;
      }
      .xv-loader__ring--2 {
        inset: -26px;
        border-style: solid;
        opacity: 0.35;
        animation-duration: 30s;
        animation-direction: normal;
      }
      .xv-loader__core {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--l-bg);
        box-shadow: 0 8px 24px -10px var(--l-primary), 0 0 0 1px color-mix(in srgb, var(--l-accent) 55%, transparent);
        font-size: 22px;
        letter-spacing: 0.08em;
        animation: xvl-pulse 2.8s ease-in-out infinite;
      }
      .xv-loader__core span {
        background: linear-gradient(100deg, var(--l-primary) 35%, color-mix(in srgb, var(--l-accent) 70%, #fff) 50%, var(--l-primary) 65%);
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: xvl-shimmer 2.4s linear infinite;
      }
      .xv-loader__spark {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--l-accent);
        box-shadow: 0 0 10px 2px color-mix(in srgb, var(--l-accent) 60%, transparent);
        animation: xvl-twinkle 2.6s ease-in-out infinite;
      }
      .xv-loader__spark:nth-of-type(1) { top: -30px; left: 20px; animation-delay: -0.3s; }
      .xv-loader__spark:nth-of-type(2) { top: 18px; right: -34px; animation-delay: -1.1s; }
      .xv-loader__spark:nth-of-type(3) { bottom: -28px; left: 40px; animation-delay: -1.8s; }
      .xv-loader__spark:nth-of-type(4) { bottom: 30px; left: -36px; animation-delay: -0.7s; }
      .xv-loader__spark:nth-of-type(5) { top: -8px; right: 4px; width: 3px; height: 3px; animation-delay: -2.2s; }
      .xv-loader__name {
        margin: 8px 0 0;
        min-height: 1em;
        font-family: var(--l-script);
        font-size: clamp(40px, 11vw, 64px);
        line-height: 1.1;
        color: var(--l-primary);
        animation: xvl-rise 1.2s ease both;
      }
      .xv-loader__name:empty {
        display: none;
      }
      .xv-loader__text {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        animation: xvl-rise 1.2s ease 0.2s both;
      }
      .xv-loader__dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .xv-loader__dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--l-primary);
        animation: xvl-dot 1.4s ease-in-out infinite;
      }
      .xv-loader__dots i:nth-child(2) { animation-delay: 0.18s; }
      .xv-loader__dots i:nth-child(3) { animation-delay: 0.36s; }
      .xv-loader__bar {
        position: relative;
        width: min(180px, 50vw);
        height: 2px;
        margin-top: 6px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--l-primary) 16%, transparent);
      }
      .xv-loader__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--l-primary), var(--l-accent), transparent);
        animation: xvl-slide 1.6s ease-in-out infinite;
      }
      .xv-loader__slow {
        margin: 6px 0 0;
        max-width: 300px;
        font-size: 13px;
        font-style: italic;
        opacity: 0.85;
        animation: xvl-rise 0.8s ease both;
      }
      .xv-loader__error {
        display: grid;
        gap: 14px;
        justify-items: center;
        max-width: 360px;
        margin: 6px 0 0;
        font-size: 15px;
        line-height: 1.5;
      }
      .xv-loader__retry {
        padding: 10px 26px;
        border: 0;
        border-radius: 999px;
        background: var(--l-primary);
        color: #fff;
        font: inherit;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
      @keyframes xvl-spin { to { transform: rotate(360deg); } }
      @keyframes xvl-bloom {
        0%, 100% { transform: rotate(calc(var(--i) * 45deg)) scale(0.55); opacity: 0.4; }
        45%, 60% { transform: rotate(calc(var(--i) * 45deg)) scale(1); opacity: 0.95; }
      }
      @keyframes xvl-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes xvl-shimmer {
        from { background-position: 130% 0; }
        to { background-position: -130% 0; }
      }
      @keyframes xvl-twinkle {
        0%, 100% { opacity: 0; transform: scale(0.3); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes xvl-dot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
        40% { transform: translateY(-5px); opacity: 1; }
      }
      @keyframes xvl-slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @keyframes xvl-rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .xv-loader *, .xv-loader *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
        .xv-loader__petal { transform: rotate(calc(var(--i) * 45deg)) scale(0.9); opacity: 0.9; }
      }
    </style>
    <script>
      // Personaliza la pantalla de carga con los colores, nombre y fuente de la última visita.
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('xv_loader') || 'null');
          if (!c) return;
          window.__xvLoader = c;
          if (c.fontScript && /^[\w .-]+$/.test(c.fontScript)) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(c.fontScript).replace(/%20/g, '+') + '&display=swap';
            document.head.appendChild(l);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="xv-loader" id="xv-boot" role="status" aria-live="polite">
        <div class="xv-loader__flower" aria-hidden="true">
          <span class="xv-loader__ring"></span>
          <span class="xv-loader__ring xv-loader__ring--2"></span>
          <span class="xv-loader__petals">
            <i class="xv-loader__petal" style="--i: 0"></i><i class="xv-loader__petal" style="--i: 1"></i><i class="xv-loader__petal" style="--i: 2"></i><i class="xv-loader__petal" style="--i: 3"></i><i class="xv-loader__petal" style="--i: 4"></i><i class="xv-loader__petal" style="--i: 5"></i><i class="xv-loader__petal" style="--i: 6"></i><i class="xv-loader__petal" style="--i: 7"></i>
          </span>
          <b class="xv-loader__spark"></b><b class="xv-loader__spark"></b><b class="xv-loader__spark"></b><b class="xv-loader__spark"></b><b class="xv-loader__spark"></b>
          <span class="xv-loader__core"><span>XV</span></span>
        </div>
        <p class="xv-loader__name"></p>
        <p class="xv-loader__text">Cargando<span class="xv-loader__dots"><i></i><i></i><i></i></span></p>
        <span class="xv-loader__bar"></span>
      </div>
      <script>
        (function () {
          var c = window.__xvLoader;
          if (!c) return;
          var el = document.getElementById('xv-boot');
          var vars = { '--l-primary': c.primary, '--l-accent': c.accent, '--l-bg': c.bg, '--l-bg2': c.bg2, '--l-text': c.text };
          for (var k in vars) if (vars[k]) el.style.setProperty(k, vars[k]);
          if (c.fontScript) el.style.setProperty('--l-script', '"' + c.fontScript + '", cursive');
          if (c.name) el.querySelector('.xv-loader__name').textContent = c.name;
          if (c.loadingText) el.querySelector('.xv-loader__text').firstChild.textContent = c.loadingText.replace(/[.…]+$/, '');
        })();
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
